<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Galeria de desenhos</title>
<link rel="stylesheet" href="../../css/app.css">
<style>
body{background:#121A24;color:#EDE6D9;font-family:Jost,sans-serif;margin:0;padding:24px}
#g{display:grid;grid-template-columns:repeat(6,1fr);gap:18px 14px}
.t{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:11px;color:#BDB5A6}
.t .hero{width:150px;height:150px;margin:0}
.row{display:flex;gap:10px;align-items:center}
h1{font:400 22px 'Bodoni Moda',serif;margin:0 0 18px}
</style></head><body>
<div id="defs"></div><h1 id="h">Desenhos dos produtos</h1><div id="g"></div>
<script type="module">
import { illustrationFor, SKETCH_FILTER } from '../../js/illustrations.js';
document.getElementById('defs').innerHTML = SKETCH_FILTER;
const N = ['Álcool 70%','Agulha 32G 6 mm','Agulha 18G','Anestésico Xilestesin c/ vaso','Anestésico Xilestesin s/ vaso','Caixa perfuro cortante','Campo de mesa descartável branco','Cânula 22G c/ agulha 22G','Cotonete','Clorexidina 2% 1L - Riohex','Demaquilante lenço','Demaquilante líquido','Disco de algodão','Fio nicrolylon 2.0 - lifting','Flaconete água para injeção 10ml','Flaconete soro fisiológico estéril 10ml','Gaze estéril c/ 10 unidades','Gorro','Hidratante labial - Potenza','Kit cirúrgico perio','Lâmina bisturi n 11','Luva cirúrgica 6.5','Luva XP','Máscara','Papel grau 5cm','Pincel para gloss','Pomada anestésica','Rolopack','Saco para lixo contaminado','Seringa 3ml com luer lock e agulha 22G','Seringa 5ml com luer lock','Seringa 30UI 6mm x 31G','Seringa 1ml com luer lock','Sabão enzimático','Torneirinha','Ácido tranexâmico','Dipirona 1g','Dexametasona 4ml','Hialuronidase','Diprospan','Tylex','Deosil','Pomada Diprogenta','Produto novo'];
const q = new URLSearchParams(location.search);
const list = q.get('n') ? N.slice(0, +q.get('n')) : N;
document.getElementById('g').innerHTML = list.map(n => `<div class="t"><div class="hero">${illustrationFor(n)}</div><div class="row"><span class="thumb ill">${illustrationFor(n)}</span></div>${n}</div>`).join('');
</script></body></html>
